<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Sales Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #faf5ff 100%); min-height: 100vh; }
  </style>
</head>
<body class="flex items-center justify-center">
  <div class="w-full max-w-sm mx-4">
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl shadow-slate-200/80 border border-slate-200 p-8">
      <div class="text-center mb-8">
        <div class="w-12 h-12 mx-auto mb-4 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-purple-200">
          <span class="text-white font-bold text-lg">K</span>
        </div>
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">Sales Agent</h1>
        <p class="text-slate-500 mt-2">Sign in to continue</p>
      </div>

      <form method="post" class="space-y-5">
        {% csrf_token %}

        {% if form.errors %}
          <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm">
            Invalid username or password.
          </div>
        {% endif %}

        <div>
          <label for="id_username" class="block text-sm font-medium text-slate-600 mb-1">Username</label>
          <input type="text" name="username" id="id_username" required
            class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:ring-purple-500 focus:border-purple-500"
            placeholder="Enter username">
        </div>

        <div>
          <label for="id_password" class="block text-sm font-medium text-slate-600 mb-1">Password</label>
          <input type="password" name="password" id="id_password" required
            class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 placeholder-slate-400 focus:ring-purple-500 focus:border-purple-500"
            placeholder="Enter password">
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-purple-200">
          Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
