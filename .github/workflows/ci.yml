name: CI

on:
  push:
    branches: ["main", "UAT", "DEV", "sales-gcp-migration", "feature/**"]
  pull_request:
    branches: ["main", "UAT", "DEV"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint & static security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-sales.txt
      - name: Install tooling
        run: pip install "ruff>=0.5" "bandit>=1.7"
      - name: Ruff (lint)
        run: ruff check sales_fastapi tests migrations
      - name: Ruff (format)
        run: ruff format --check sales_fastapi tests migrations
      - name: Bandit (SAST)
        run: bandit -r sales_fastapi -x sales_fastapi/static -ll

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-sales.txt
      - name: Install dependencies
        run: pip install -r requirements-sales-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=sales_fastapi --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  migration:
    name: Migration parity (SQLite/Postgres)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_migration.db
      SECRET_KEY: ${{ format('ci-{0}-{1}', github.run_id, github.sha) }}
      ENV: test
      AUTH_DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-sales.txt
      - name: Install dependencies
        run: pip install -r requirements-sales.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Model / migration parity
        run: alembic check
      - name: Downgrade back to base
        run: alembic downgrade base

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit
        run: |
          pip install "pip-audit>=2.7"
          pip-audit -r requirements-sales.txt

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -f Dockerfile.sales -t kalisoft-sales:ci .
