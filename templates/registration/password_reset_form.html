<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — KalisoftAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #faf5ff 100%); min-height: 100vh; }

    .auth-field { position: relative; }
    .field-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #475569;
      margin-bottom: 0.35rem;
    }
    .help-text {
      font-size: 0.75rem;
      line-height: 1.6;
      color: #94a3b8;
      margin: 0.125rem 0 0.5rem;
    }
    .error-text {
      font-size: 0.75rem;
      color: #ef4444;
      margin-top: 0.375rem;
    }
    .input-shell { position: relative; }
    .field-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.125rem;
      height: 1.125rem;
      color: #94a3b8;
      pointer-events: none;
    }
    .auth-input {
      display: block;
      width: 100%;
      padding: 0.6875rem 0.75rem 0.6875rem 2.625rem;
      font-size: 0.9375rem;
      color: #1e293b;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .auth-input::placeholder { color: #94a3b8; }
    .auth-input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.28);
    }

    .logo-halo {
      box-shadow: 0 0 0 3px rgba(252, 211, 77, 0.45),
                  0 18px 30px -10px rgba(124, 58, 237, 0.35);
    }
    .heading-accent {
      width: 3rem;
      height: 0.25rem;
      margin: 0.75rem auto 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, #fcd34d, #f59e0b);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen py-8">
  <div class="w-full max-w-md mx-4">
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl shadow-slate-200/80 border border-slate-200">
      <div class="text-center pt-8 pb-6 px-8">
        <div class="w-14 h-14 mx-auto mb-5 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-2xl flex items-center justify-center logo-halo">
          <span class="text-3xl font-bold text-white">K</span>
        </div>
        <h1 class="text-3xl font-bold text-slate-800">Reset Password</h1>
        <div class="heading-accent" aria-hidden="true"></div>
        <p class="text-slate-500 mt-3">Enter your account email and we'll send you a reset link</p>
      </div>

      <form method="post" class="px-8 pb-8 space-y-5">
        {% csrf_token %}

        {% if form.non_field_errors %}
          <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm">
            {{ form.non_field_errors }}
          </div>
        {% endif %}

        <div class="auth-field">
          <label for="id_email" class="field-label">Email address</label>
          <div class="input-shell">
            <svg xmlns="http://www.w3.org/2000/svg" class="field-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input type="email" name="email" id="id_email" autocomplete="email" required
              class="auth-input"
              placeholder="Enter your email"
              value="{% if form.email.value %}{{ form.email.value }}{% endif %}">
          </div>
          {% for error in form.email.errors %}
            <p class="error-text">{{ error }}</p>
          {% endfor %}
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-semibold py-3 rounded-lg transition shadow-lg shadow-purple-200">
          Send Reset Link
        </button>

        <p class="text-center text-sm text-slate-500">
          Remembered it?
          <a href="{% url 'login' %}" class="font-medium text-purple-600 hover:text-purple-500 underline">Back to sign in</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
