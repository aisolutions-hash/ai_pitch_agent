<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete — KalisoftAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #faf5ff 100%); min-height: 100vh; }
    .logo-halo {
      box-shadow: 0 0 0 3px rgba(252, 211, 77, 0.45),
                  0 18px 30px -10px rgba(124, 58, 237, 0.35);
    }
    .heading-accent {
      width: 3rem;
      height: 0.25rem;
      margin: 0.75rem auto 0;
      border-radius: 9999px;
      background: linear-gradient(90deg, #fcd34d, #f59e0b);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen py-8">
  <div class="w-full max-w-md mx-4">
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl shadow-slate-200/80 border border-slate-200">
      <div class="text-center pt-8 pb-8 px-8">
        <div class="w-14 h-14 mx-auto mb-5 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center logo-halo">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-800">Password Reset Complete</h1>
        <div class="heading-accent" aria-hidden="true"></div>
        <p class="text-slate-500 mt-4 leading-relaxed">
          Your password has been changed successfully.
          You can now sign in with your new password.
        </p>

        <a href="{% url 'login' %}"
          class="mt-8 inline-block bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-semibold py-3 px-8 rounded-lg transition shadow-lg shadow-purple-200">
          Sign In
        </a>
      </div>
    </div>
  </div>
</body>
</html>
