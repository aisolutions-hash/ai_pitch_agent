<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Sales Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; }
  </style>
</head>
<body class="flex items-center justify-center">
  <div class="w-full max-w-sm mx-4">
    <div class="bg-slate-800/80 backdrop-blur-sm rounded-2xl shadow-2xl border border-slate-700 p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white">Sales Agent</h1>
        <p class="text-slate-400 mt-2">Sign in to continue</p>
      </div>

      <form method="post" class="space-y-5">
        {% csrf_token %}

        {% if form.errors %}
          <div class="bg-red-900/40 border border-red-700 text-red-300 px-4 py-3 rounded-lg text-sm">
            Invalid username or password.
          </div>
        {% endif %}

        <div>
          <label for="id_username" class="block text-sm text-slate-400 mb-1">Username</label>
          <input type="text" name="username" id="id_username" required
            class="w-full p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-slate-200 focus:ring-purple-500 focus:border-purple-500"
            placeholder="Enter username">
        </div>

        <div>
          <label for="id_password" class="block text-sm text-slate-400 mb-1">Password</label>
          <input type="password" name="password" id="id_password" required
            class="w-full p-2.5 bg-slate-700 border border-slate-600 rounded-lg text-slate-200 focus:ring-purple-500 focus:border-purple-500"
            placeholder="Enter password">
        </div>

        <button type="submit"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-lg transition">
          Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
